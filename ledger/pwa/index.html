<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f7d6b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="가계부">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <title>가계부</title>
</head>
<body>
  <header class="top"><h1 id="title">가계부</h1><span id="syncBadge" class="badge" hidden></span></header>
  <main id="view" aria-live="polite"></main>
  <nav class="tabs" id="tabs">
    <button data-tab="home" class="on"><i>🏠</i>홈</button>
    <button data-tab="list"><i>🧾</i>내역</button>
    <button data-tab="report"><i>📊</i>정산</button>
    <button data-tab="settings"><i>⚙️</i>설정</button>
  </nav>
  <div id="sheet" class="sheet" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <input id="photo" type="file" accept="image/*" capture="environment" hidden>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>

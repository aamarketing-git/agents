<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결제 완료</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR',sans-serif;background:linear-gradient(160deg,#e8f8e0,#e3f2fd 50%,#f3e5f5);min-height:100vh;color:#2e3a3f}
.wrap{max-width:560px;margin:0 auto;padding:40px 16px}
.card{background:#fff;border-radius:18px;padding:28px 22px;box-shadow:0 6px 24px rgba(0,0,0,.08);text-align:center}
.ico{font-size:3.6rem;margin-bottom:8px}
.ok h2{color:#2e7d32;font-size:1.5rem;font-weight:800;margin-bottom:6px}
.ng h2{color:#c62828;font-size:1.4rem;font-weight:800;margin-bottom:6px}
.sub{color:#607d8b;font-size:.9rem;margin-bottom:20px}
.rows{text-align:left;border-top:1px solid #eee;margin-top:6px}
.row{display:flex;justify-content:space-between;padding:12px 2px;border-bottom:1px solid #f3f3f3;font-size:.92rem}
.row .l{color:#90a4ae}.row .v{font-weight:600;text-align:right;max-width:62%;word-break:break-all}
.row.total .v{color:#2e7d32;font-weight:800;font-size:1.1rem}
.btns{margin-top:22px;display:flex;flex-direction:column;gap:10px}
.btn{padding:14px;border-radius:50px;font-size:1rem;font-weight:700;text-decoration:none;border:none;cursor:pointer;display:block}
.btn-main{background:linear-gradient(135deg,#43a047,#66bb6a);color:#fff}
.btn-sub{background:#eceff1;color:#455a64}
.spin{width:44px;height:44px;border:4px solid #e0e0e0;border-top-color:#43a047;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.receipt-link{display:inline-block;margin-top:4px;color:#1565c0;font-size:.85rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="card" id="box">
    <div class="spin"></div>
    <p class="sub">결제 승인 중입니다…</p>
  </div>
</div>
<script>
/* Apps Script 배포 URL (index.html 과 동일하게) */
var API_URL = 'https://script.google.com/macros/s/여기에_배포URL/exec';

function qp(k){ return new URLSearchParams(location.search).get(k); }
function jsonp(params){
  return new Promise(function(resolve, reject){
    var cb='cb_'+Date.now()+'_'+Math.floor(Math.random()*10000);
    var timer=setTimeout(function(){cleanup();reject(new Error('timeout'));},20000);
    function cleanup(){clearTimeout(timer);delete window[cb];if(s.parentNode)s.parentNode.removeChild(s);}
    window[cb]=function(r){cleanup();resolve(r);};
    var q=Object.keys(params).map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(params[k]);}).join('&');
    var s=document.createElement('script');
    s.src=API_URL+'?'+q+'&callback='+cb; s.onerror=function(){cleanup();reject(new Error('network'));};
    document.body.appendChild(s);
  });
}
function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var paymentKey=qp('paymentKey'), orderId=qp('orderId'), amount=qp('amount');

if(!paymentKey||!orderId||!amount){ showFail('결제 정보가 올바르지 않습니다.'); }
else {
  jsonp({ action:'confirm', paymentKey:paymentKey, orderId:orderId, amount:amount })
  .then(function(res){
    if(res && res.success){ try{localStorage.removeItem('lastOrder');}catch(e){} showOk(res.order||{}); }
    else { showFail((res&&res.message)||'결제 승인에 실패했습니다.', orderId); }
  })
  .catch(function(){ showFail('승인 처리 중 통신 오류가 발생했습니다. 잠시 후 \'내 주문 조회\'에서 확인해주세요.', orderId); });
}

function showOk(o){
  var rows='';
  function r(l,v,cls){ return v?('<div class="row '+(cls||'')+'"><span class="l">'+l+'</span><span class="v">'+v+'</span></div>'):''; }
  rows+=r('주문번호', esc(o.orderId||orderId));
  rows+=r('주문자', esc(o.ordererName));
  rows+=r('상품', esc(o.items));
  rows+=r('결제수단', esc(o.method));
  rows+=r('결제금액', (parseInt(o.totalAmount||amount)).toLocaleString()+'원', 'total');
  var receipt = o.receipt ? '<a class="receipt-link" href="'+esc(o.receipt)+'" target="_blank">🧾 영수증 보기</a>' : '';
  document.getElementById('box').innerHTML =
    '<div class="ok"><div class="ico">✅</div><h2>결제가 완료되었습니다</h2>'+
    '<p class="sub">주문이 정상 접수되었습니다.</p>'+receipt+
    '<div class="rows">'+rows+'</div>'+
    '<div class="btns"><a class="btn btn-main" href="order-status.html">📋 내 주문 조회</a>'+
    '<a class="btn btn-sub" href="index.html">홈으로</a></div></div>';
}
function showFail(msg, oid){
  document.getElementById('box').innerHTML =
    '<div class="ng"><div class="ico">⚠️</div><h2>결제 처리 안내</h2>'+
    '<p class="sub">'+esc(msg)+'</p>'+
    (oid?('<div class="rows"><div class="row"><span class="l">주문번호</span><span class="v">'+esc(oid)+'</span></div></div>'):'')+
    '<div class="btns"><a class="btn btn-main" href="index.html">다시 주문하기</a>'+
    '<a class="btn btn-sub" href="order-status.html">내 주문 조회</a></div></div>';
}
</script>
</body>
</html>

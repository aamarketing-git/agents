<!doctype html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#F6F3EC; --card:#FFFFFF; --ink:#1F1D1A; --ink2:#3F3C36; --muted:#5E5A52; --line:#DDD6C8; --line2:#EFEBE2; --field:#CFC7B6; --faint:#A8A08F;

  --bg:#141816; --card:#1D2220; --ink:#ECE8DF; --ink2:#D2CDC3; --muted:#A7A195; --line:#343B38; --line2:#272D2A; --field:#4A524E; --faint:#6E756F;
  --teal:#6CC0AF; --on-teal:#0E1C18; --teal-soft:#1D3530; --teal-mid:#2E6A5F; --clay:#E8956A; --clay-ink:#F4BC98; --clay-soft:#3A2A21; --navy:#A3B1E3; --on-navy:#141A2E; --navy-soft:#252B40;
  --veil:rgba(20,24,22,.92); --shadow:rgba(0,0,0,.5); color-scheme:dark;

:root[data-theme="dark"]{
  --bg:#141816; --card:#1D2220; --ink:#ECE8DF; --ink2:#D2CDC3; --muted:#A7A195; --line:#343B38; --line2:#272D2A; --field:#4A524E; --faint:#6E756F;
  --teal:#6CC0AF; --on-teal:#0E1C18; --teal-soft:#1D3530; --teal-mid:#2E6A5F; --clay:#E8956A; --clay-ink:#F4BC98; --clay-soft:#3A2A21; --navy:#A3B1E3; --on-navy:#141A2E; --navy-soft:#252B40;
  --veil:rgba(20,24,22,.92); --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--teal)}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
main{flex:1;padding:24px 20px 110px;display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(4,1fr);max-width:480px;margin:0 auto}
nav.tabs button{min-height:52px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--muted)}
nav.tabs button[aria-current="page"]{color:var(--teal);font-weight:700}
h1{margin:0;font-size:24px;font-weight:700}
h2{margin:0;font-size:16px;font-weight:700}
.sub{font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero{background:var(--teal);color:var(--on-teal);border-radius:18px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero .small{font-size:13px;opacity:.9}
.hero .big{font-size:18px;font-weight:600}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.white{background:var(--on-teal);color:var(--teal)}
.pill.teal{background:var(--teal-soft);color:var(--teal)}
.pill.clay{background:var(--clay-soft);color:var(--clay-ink)}
.pill.navy{background:var(--navy-soft);color:var(--navy)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:14px;font-weight:600}
.row{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:12px}
.row .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;border:0;background:none;padding:0}
.row .name{font-size:15px;font-weight:600;display:flex;gap:6px;align-items:center;min-width:0}
.row .name span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:6px;white-space:nowrap;font-weight:500}
.row .cat{font-size:13px;color:var(--muted)}
.amt{font-size:15px;font-weight:700;white-space:nowrap}
.inc{color:var(--teal)}
.exp{color:var(--clay)}
.btn{min-height:44px;border:0;border-radius:12px;padding:0 14px;font-size:14px;font-weight:600}
.btn.primary{background:var(--teal);color:var(--on-teal)}
.btn.danger{background:var(--clay);color:var(--bg)}
.btn.soft{background:var(--clay-soft);color:var(--clay-ink)}
.btn.line{background:var(--card);border:1px solid var(--field)}
.btn.block{width:100%;min-height:52px;font-size:16px;font-weight:700;border-radius:14px}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.5}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=url],textarea{height:48px;border:1px solid var(--field);border-radius:12px;padding:0 14px;font-size:16px;background:var(--card);color:var(--ink);width:100%}
textarea{height:auto;padding:12px 14px;font-size:13px;font-family:ui-monospace,Menlo,monospace;resize:none}
.inline{display:flex;gap:8px}
.inline input{flex:1}
.seg{display:grid;gap:4px;background:var(--line2);border-radius:12px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-size:15px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);font-weight:700}
.seg.biz button[aria-pressed="true"].is-biz{background:var(--navy);color:var(--on-navy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--field);background:var(--card);color:var(--ink2)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--on-teal)}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-size:20px;font-weight:700}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar > div{height:8px;border-radius:4px;background:var(--teal)}
.bars7{height:180px;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;align-items:end}
.bars7 .col{display:flex;flex-direction:column;align-items:center;gap:6px}
.bars7 .col .b{width:100%;border-radius:6px 6px 2px 2px;background:var(--teal);min-height:2px}
.bars7 .col .l{font-size:13px;font-weight:600}
.bars7 .col .a{font-size:11px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:12px;color:var(--muted);text-align:center}
.cal button{height:40px;border:0;border-radius:8px;font-size:13px;font-weight:600;padding:0}
.note{background:var(--clay-soft);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5}
.line3{display:flex;gap:12px}
.line3 .ic{width:28px;height:28px;flex-shrink:0;border-radius:14px;display:flex;align-items:center;justify-content:center}
.line3 .t{font-size:13px;font-weight:600}
.line3 .d{font-size:15px;line-height:1.5}
.list > *{padding:12px 0;border-bottom:1px solid var(--line2)}
.list > *:last-child{border-bottom:0}
.table{font-size:13px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.table .tr{display:grid;grid-template-columns:52px minmax(0,1fr) 64px 84px;gap:8px;padding:10px 12px;border-top:1px solid var(--line2)}
.table .tr.head{background:var(--line2);border-top:0;font-weight:600;color:var(--ink2)}
.table .tr div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r{text-align:right}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps div{height:6px;border-radius:3px;background:var(--line)}
.steps div.on{background:var(--teal)}
.ol{display:flex;flex-direction:column;gap:12px;font-size:15px;line-height:1.5}
.ol > div{display:flex;gap:10px}
.ol b.n{color:var(--teal)}
.empty{font-size:14px;color:var(--muted);text-align:center;padding:16px 0}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:14px;max-width:90%;z-index:20;box-shadow:0 6px 20px var(--shadow)}
.busy{white-space:pre-line;position:fixed;inset:0;background:var(--veil);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;font-size:16px;font-weight:600;text-align:center;padding:24px}
.spin{width:36px;height:36px;border:4px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.back{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;margin-left:-12px}
.thumb{width:84px;height:112px;flex-shrink:0;border-radius:12px;border:1px dashed var(--faint);background:var(--line2);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--muted);text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.check{display:flex;gap:12px;align-items:center;min-height:44px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--teal)}
</style>
</head>

/* ---------- 사진 · 캡처 올리기 ---------- */
function readAsBase64(file) {
  return new Promise(function (resolve, reject) {
    if (file.type === 'application/pdf') {
      var fr = new FileReader();
      fr.onload = function () { resolve({ data: String(fr.result).split(',')[1], mime: 'application/pdf' }); };
      fr.onerror = reject;
      fr.readAsDataURL(file);
      return;
    }
    // 사진은 긴 변 1600px JPEG로 줄여서 보냄 (전송·인식 속도)
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var max = 1600, w = img.naturalWidth, hgt = img.naturalHeight, r = Math.min(1, max / Math.max(w, hgt));
      var c = document.createElement('canvas');
      c.width = Math.round(w * r); c.height = Math.round(hgt * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve({ data: c.toDataURL('image/jpeg', 0.85).split(',')[1], mime: 'image/jpeg' });
    };
    img.onerror = function () { reject(new Error('사진을 열 수 없어요')); };
    img.src = url;
  });
}

function uploadFiles(files, source) {
  files = [].slice.call(files || []);
  if (!files.length) return;
  var i = 0, last = null;
  function next() {
    if (i >= files.length) {
      busy(null);
      refresh().then(function () { if (last && last.group && !last.duplicate) openEdit(last.group); });
      return;
    }
    var f = files[i++];
    busy('영수증 읽는 중… ' + (files.length > 1 ? '(' + i + '/' + files.length + ') ' : '') + '\n10~30초쯤 걸려요');
    readAsBase64(f).then(function (x) {
      return call('apiAddImage', x.data, x.mime, f.name || '', source);
    }).then(function (r) {
      last = r;
      if (r.duplicate && !r.merged) toast('이미 기록된 결제예요');
      else if (r.merged) toast('카드 결제와 한 건으로 합쳤어요');
      next();
    }).catch(function (e) { toast(errMsg(e)); next(); });
  }
  next();
}

      ) : h('div', { class: 'card ol' },
        h('div', null, h('b', { class: 'n' }, '1'), h('div', null, '가장 쉬운 방법: 결제 문자를 길게 눌러 복사 → 기록 탭 ‘한 줄로 기록’에 붙여 넣기')),
        h('div', null, h('b', { class: 'n' }, '2'), h('div', null, '완전 자동: 문자 자동화 앱(예: MacroDroid)에서 ‘문자 수신 → HTTP POST’로 아래 주소와 본문을 넣어요'))),
      b.hook.url ? copyField(b.hook.url, '기록 주소 (웹 앱 URL)') : h('div', { class: 'note' }, '아직 웹 앱으로 배포되지 않았어요. 시트의 Apps Script에서 배포 → 새 배포 → 웹 앱을 먼저 해 주세요.'),
      copyField(hookBody(), '요청 본문 (JSON) — text 자리에 문자 내용'),
      h('p', { style: 'margin:0;font-size:13px;line-height:1.6;color:var(--muted)' }, '카드사 아이디·비밀번호는 묻지 않아요. 폰에 온 결제 문자만 읽습니다. 이 주소와 token은 비밀번호처럼 지켜 주세요.')
    ];
  } else {
    body = [
      h('h1', { style: 'font-size:28px;line-height:1.3' }, '쿠팡 주문 메일로', h('br'), '품목까지 채울까요?'),
      h('p', { style: 'margin:0;font-size:16px;line-height:1.6;color:var(--ink2)' }, '주문확인 메일에서 무엇을 샀는지 읽어 카드 결제와 한 건으로 합쳐요. 기저귀는 육아, 과자는 식비로 나눠 기록됩니다.'),
      h('label', { class: 'card check', style: 'flex-direction:row;padding:14px 16px' }, h('input', { type: 'checkbox', checked: O.mail, onchange: function (e) { O.mail = e.target.checked; } }), '쿠팡 · 네이버페이 · 배달앱 주문 메일 읽기'),
      h('p', { style: 'margin:0;font-size:13px;line-height:1.6;color:var(--muted)' }, '주문·결제 메일만 검색해서 읽고, 읽은 메일에는 “' + '가계부처리' + '” 라벨을 붙여요. 내 시트 탭에서 언제든 끌 수 있어요.')
    ];
  }
  var last = O.step === 3;
  return [
    h('div', { class: 'steps' }, [1, 2, 3].map(function (i) { return h('div', { class: i <= O.step ? 'on' : '' }); })),
    h('div', { style: 'font-size:14px;font-weight:600;color:var(--teal)' }, labels[O.step - 1]),
    body,
    h('div', { style: 'display:grid;grid-template-columns:110px 1fr;gap:10px;margin-top:8px' },
      h('button', { class: 'btn line block', style: 'font-weight:600', onclick: function () { if (O.step > 1) { O.step--; render(); } else go('home'); } }, O.step > 1 ? '이전' : '닫기'),
      h('button', { class: 'btn primary block', onclick: function () { if (!last) { O.step++; render(); window.scrollTo(0, 0); } else finishOnboard(); } }, last ? '시작하기' : '다음'))
  ];
}
function finishOnboard() {
  var O = S.ob;
  busy('설정 저장 중…');
  call('apiSaveSettings', WEB ? { taxRate: O.tax, savingGoal: O.goal, onboarded: true } : { taxRate: O.tax, savingGoal: O.goal, mailScan: O.mail, onboarded: true })
    .then(function (s) { busy(null); S.boot.settings = s; S.report = null; go('home'); })
    .catch(function (e) { busy(null); toast(errMsg(e)); });
}

/* ---------- 시작 ---------- */
render();
// 웹 판: 다른 기기·사람이 바꾼 기록이 들어오면 다시 그림 (고치는 중에는 방해하지 않음)
if (ENV.subscribe) ENV.subscribe(function () { if (S.boot && S.view !== 'edit' && S.view !== 'onboard') refresh(); });
call('apiBootstrap').then(function (b) {
  S.boot = b;
  if (!b.settings.onboarded) S.view = 'onboard';
  render();
}).catch(function (e) {
  document.getElementById('main').innerHTML = '';
  append(document.getElementById('main'), h('div', { class: 'card' }, h('h2', null, '열 수 없어요'), h('div', { class: 'sub' }, errMsg(e))));
});
</script>
</body>
</html>
